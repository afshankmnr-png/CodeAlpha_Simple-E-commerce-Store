
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px 15px;
        }

        .container {
            max-width: 420px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        h1 {
            text-align: center;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .errorlist {
            color: red;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Create Account</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Register</button>
        </form>

        <p>Already registered?
            <a href="{% url 'login' %}">Login here</a>
        </p>

        <p>
            <a href="{% url 'product_list' %}">Back to Store</a>
        </p>
    </div>
</body>
</html>
