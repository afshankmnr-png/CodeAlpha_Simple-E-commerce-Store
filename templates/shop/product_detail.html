
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} - Product Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        h1 {
            color: #222;
        }

        img {
            max-width: 100%;
            height: 250px;
            object-fit: contain;
        }

        .price {
            color: #087f23;
            font-size: 24px;
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 15px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        {% if product.image_url %}
        <img src="{{ product.image_url }}" alt="{{ product.name }}">
        {% endif %}

        <h1>{{ product.name }}</h1>

        <p>{{ product.description }}</p>

        <p class="price">₹{{ product.price }}</p>

        <p>Available Stock: {{ product.stock }}</p>

        <a href="{% url 'product_list' %}">Back to Products</a>
    </div>
</body>
</html>
